name: proof-function-tracing

on:
  pull_request:
    paths:
      - 'proofs/function-tracing/**'
      - 'tests/test_function_tracing_proof.py'
      - '.github/workflows/proof-function-tracing.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install pinned compiler generations and record package identities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            'gcc-12=12.4.0-2ubuntu1~24.04.1' 'g++-12=12.4.0-2ubuntu1~24.04.1' \
            'clang-18=1:18.1.3-1ubuntu1' 'llvm-18=1:18.1.3-1ubuntu1' \
            'libclang-rt-18-dev=1:18.1.3-1ubuntu1' cmake binutils
          mkdir -p build/function-tracing-host
          dpkg-query -W > build/function-tracing-host/packages.txt
          uname -a > build/function-tracing-host/uname.txt
          ldd --version > build/function-tracing-host/glibc.txt
          uv venv .venv
          uv pip install -p .venv/bin/python -r container/requirements.lock -e 'python/[dev]'
      - name: Qualify optimized ADAS function tracing
        run: bash proofs/function-tracing/run-proof.sh "$PWD/build/function-tracing-evidence" "$RUNNER_TEMP/function-tracing-build"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: function-tracing-evidence
          path: |
            build/function-tracing-evidence/
            build/function-tracing-host/
          retention-days: 30
