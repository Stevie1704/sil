name: docs-site

# Builds the documentation site on each pull request and publishes it from
# main to GitHub Pages (#401). The strict MkDocs build fails on a broken
# page link, anchor or asset; tools/docs_site.py fails on a link to a file
# that is not in the checkout. Links to other sites are not crawled.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The commit the site shows and its source links name: the PR head on
      # a pull request, else the pushed commit.
      DOCS_REV: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build the site
        run: make docs-site DOCS_REV="$DOCS_REV"

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs-site/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
