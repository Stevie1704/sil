name: proof-adas-matrix
on:
  pull_request:
    paths:
      - 'examples/adas-reference/**'
      - 'proofs/adas-matrix/**'
      - 'proofs/adas-equivalence/**'
      - 'proofs/adas-closed-loop/**'
      - 'proofs/adas-fmu/**'
      - 'proofs/acc-fmi/**'
      - 'python/**'
      - 'kernel/**'
      - 'include/**'
      - 'shim/**'
      - 'tools/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'container/**'
      - 'tests/test_adas_matrix.py'
      - '.github/workflows/proof-adas-matrix.yml'
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and run the clean installed offline matrix
        run: proofs/adas-matrix/run-proof.sh "$PWD/build/adas-matrix-evidence"
      - name: Check the installed CLI and ignored-exit control
        run: |
          python -m pip install --quiet "pytest==9.1.1"
          SIL_ADAS_MATRIX_IMAGE=sil-adas-matrix:example python -m pytest tests/test_adas_matrix.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adas-matrix-evidence
          path: build/adas-matrix-evidence/
