name: proof-acc-fmi

# This external-exporter qualification builds a pinned image and downloads its
# Python toolchain, so it sits outside the general push gate. It runs for PRs
# touching either the proof or its Importer/model dependencies. Unlike the
# released-runtime consumer proofs, it qualifies the checkout's resourcePath
# correction before release; the README explains this deliberate scope.

on:
  pull_request:
    paths:
      - 'proofs/acc-fmi/**'
      - 'python/src/sil/fmi/**'
      - 'python/src/sil/examples/acc/**'
      - '.github/workflows/proof-acc-fmi.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build once and execute all ACC proofs on Linux x86-64
        env:
          SIL_ACC_PROOF: all
        run: proofs/acc-fmi/run-proof.sh "$PWD/build/acc-fmi-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-fmi-evidence
          path: build/acc-fmi-evidence/qualify/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-loop-evidence
          path: build/acc-fmi-evidence/closed_loop/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-sensitivity-evidence
          path: build/acc-fmi-evidence/sensitivity/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-scenario-evidence
          path: build/acc-fmi-evidence/scenarios/
      - name: Keep all proofs' Manifests and Recordings separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-fmi-workspace
          path: |
            build/acc-fmi-evidence/qualify/*.json
            build/acc-fmi-evidence/qualify/*.mcap
            build/acc-fmi-evidence/closed_loop/*.json
            build/acc-fmi-evidence/closed_loop/*.mcap
            build/acc-fmi-evidence/sensitivity/*.json
            build/acc-fmi-evidence/sensitivity/*.mcap
            build/acc-fmi-evidence/scenarios/*.json
            build/acc-fmi-evidence/scenarios/*.mcap
