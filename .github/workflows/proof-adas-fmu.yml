name: proof-adas-fmu

# The ADAS reference FMU export (issue #225), on its acceptance platform. It
# builds a pinned preparation image with network, so it sits outside the
# general push gate. It runs for PRs touching the application, its FMI
# interface, the proof, or the inspection the proof records.

on:
  pull_request:
    paths:
      - 'examples/adas-reference/**'
      - 'proofs/adas-fmu/**'
      - 'proofs/acc-fmi/requirements.lock'
      - 'python/src/sil/fmi/**'
      - '.github/workflows/proof-adas-fmu.yml'
  workflow_dispatch:

jobs:
  proof:
    # Native linux/amd64: the platform the archive is built for and pinned on.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build twice, audit, check with FMPy, run the control
        run: proofs/adas-fmu/run-proof.sh "$PWD/build/adas-fmu-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adas-fmu-evidence
          path: build/adas-fmu-evidence/
