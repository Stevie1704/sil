name: can-model
on:
  pull_request:
  push:
    branches: [main]
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and qualify standalone CAN FMU
        run: models/can/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: can-model-qualification
          path: build/can/
