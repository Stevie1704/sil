name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python environment
        run: |
          uv venv .venv
          uv pip install -p .venv/bin/python -e "python/[dev]"

      - name: Build kernel
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure

      # Full suite includes the milestone exit criterion: run twice ->
      # bit-identical MCAP (tests/test_determinism.py).
      - name: Run tests
        run: SIL_SKIP_BUILD=1 .venv/bin/python -m pytest tests/ -v

      # The reference pipeline, both variants of the ACC reference example, the
      # FMU import example, and the CSV replay example, so every example is
      # proven bit-identical on each push rather than when someone remembers.
      - name: Determinism gate on reference manifests
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src
        run: .venv/bin/python tools/determinism_gate.py

      - name: Stage native Linux installation for container parity
        run: |
          cmake --install build --prefix build/native
          uv build --wheel --out-dir build/wheels python
          uv venv build/native/python
          uv pip install -p build/native/python/bin/python \
            --constraint container/requirements.lock build/wheels/sil-*.whl

      - name: Build production and reference acceptance images
        run: |
          version="$(python3 tools/release.py project-version)"
          docker build --target runtime --tag sil-runtime:ci \
            --build-arg SIL_VERSION="$version" \
            --build-arg SIL_SOURCE_REPOSITORY="https://github.com/Stevie1704/sil" \
            --build-arg SIL_SOURCE_REVISION="$GITHUB_SHA" .
          docker build --target acceptance --tag sil-acceptance:ci \
            --build-arg SIL_VERSION="$version" \
            --build-arg SIL_SOURCE_REPOSITORY="https://github.com/Stevie1704/sil" \
            --build-arg SIL_SOURCE_REVISION="$GITHUB_SHA" .

      - name: Run Linux container acceptance checks
        env:
          SIL_CONTAINER_IMAGE: sil-runtime:ci
          SIL_CONTAINER_ACCEPTANCE_IMAGE: sil-acceptance:ci
          SIL_NATIVE_RUNNER: build/native/bin/sil-run
        run: .venv/bin/python -m pytest tests/test_container.py -v
