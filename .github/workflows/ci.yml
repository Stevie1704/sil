name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python environment
        run: |
          uv venv .venv
          uv pip install -p .venv/bin/python -e "python/[dev]"

      - name: Build kernel
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure

      # Full suite includes the milestone exit criterion: run twice ->
      # bit-identical MCAP (tests/test_determinism.py).
      - name: Run tests
        run: SIL_SKIP_BUILD=1 .venv/bin/python -m pytest tests/ -v

      # The reference pipeline, both variants of the ACC reference example, and
      # the FMU import example, so every example is proven bit-identical on
      # each push rather than when someone remembers to run it.
      - name: Determinism gate on reference manifests
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src
        run: |
          .venv/bin/python - <<'EOF'
          import sys
          from pathlib import Path
          import importlib.util
          sys.path.insert(0, "tests")
          from test_determinism import full_pipeline_manifest
          from sil.check import check

          def load(name, path):
              # Both examples define a module called `manifest`, so they are
              # loaded by path rather than found on sys.path.
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          acc = load("acc_manifest", "examples/acc/manifest.py")
          fmu = load("fmu_manifest", "examples/fmu/manifest.py")
          refs = [
              full_pipeline_manifest(Path("build")),
              acc.acc_manifest().write("build/acc.json"),
              acc.acc_manifest(delayed_sensing=True).write("build/acc-delayed.json"),
              fmu.fmu_manifest().write("build/fmu.json"),
          ]
          for ref in refs:
              code = check(Path("build/sil-run"), ref.path)
              if code:
                  raise SystemExit(code)
          EOF
