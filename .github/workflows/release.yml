name: release

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/stevie1704/sil
  SOURCE_REPOSITORY: https://github.com/Stevie1704/sil

jobs:
  verify:
    name: Build and smoke-test release shapes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v5

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="$(python3 tools/release.py validate-tag --root . --tag "$GITHUB_REF_NAME")"
          else
            version="$(python3 tools/release.py project-version --root .)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build wheel and source distribution from the checkout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 tools/release.py stamp-python --root . \
            --version "$VERSION" --source-revision "$GITHUB_SHA"
          uv build --wheel --sdist --out-dir dist python

      - name: Build and stage the native development prefix
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DSIL_SOURCE_REPOSITORY="$SOURCE_REPOSITORY" \
            -DSIL_SOURCE_REVISION="$GITHUB_SHA"
          cmake --build build -j2
          cmake --install build --prefix build/native
          python3 tools/release.py make-native-archive \
            --prefix build/native \
            --output "dist/sil-native-dev-${VERSION}-linux-x86_64.tar.gz" \
            --version "$VERSION"
          python3 tools/release.py validate-runner \
            --runner build/native/bin/sil-run --version "$VERSION" \
            --source-revision "$GITHUB_SHA"
          python3 tools/release.py validate-native-archive \
            --archive "dist/sil-native-dev-${VERSION}-linux-x86_64.tar.gz" \
            --version "$VERSION" --source-revision "$GITHUB_SHA"
          python3 tools/release.py validate-distributions \
            --root . --dist dist --version "$VERSION" \
            --source-revision "$GITHUB_SHA"

      - name: Build the non-publishing runtime image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build --target runtime \
            --tag "sil-runtime:${VERSION}-ci" \
            --build-arg SIL_VERSION="$VERSION" \
            --build-arg SIL_SOURCE_REPOSITORY="$SOURCE_REPOSITORY" \
            --build-arg SIL_SOURCE_REVISION="$GITHUB_SHA" .
          python3 tools/release.py validate-image \
            --image "sil-runtime:${VERSION}-ci" --version "$VERSION" \
            --source-revision "$GITHUB_SHA"

      - name: Smoke-test only the new wheel, native archive, and image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 tools/release_smoke.py \
            --bundle dist \
            --image "sil-runtime:${VERSION}-ci" \
            --version "$VERSION" \
            --source-revision "$GITHUB_SHA"

      - name: Preserve the verified downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ steps.version.outputs.version }}
          path: dist
          if-no-files-found: error

  publish:
    name: Publish the immutable release bundle
    if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ needs.verify.outputs.version }}
          path: dist

      - name: Set up Buildx and authenticate to GHCR
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to replace a published version
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          test "$(python3 tools/release.py validate-tag --root . --tag "$GITHUB_REF_NAME")" = "$VERSION"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi
          if docker manifest inspect "${IMAGE_NAME}:${VERSION}" >/dev/null 2>&1; then
            echo "container tag ${IMAGE_NAME}:${VERSION} already exists" >&2
            exit 1
          fi

      - name: Publish the version tag and record its content digest
        id: image
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --target runtime \
            --tag "${IMAGE_NAME}:${VERSION}" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            --build-arg SIL_VERSION="$VERSION" \
            --build-arg SIL_SOURCE_REPOSITORY="$SOURCE_REPOSITORY" \
            --build-arg SIL_SOURCE_REVISION="$GITHUB_SHA" \
            --provenance=false --sbom=false --push \
            --metadata-file image-metadata.json .
          digest="$(jq -r '."containerimage.digest"' image-metadata.json)"
          test "$digest" != "null" -a "$digest" != ""
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "reference=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"
          docker pull "${IMAGE_NAME}@${digest}"
          python3 tools/release.py validate-image \
            --image "${IMAGE_NAME}@${digest}" --version "$VERSION" \
            --source-revision "$GITHUB_SHA"

      - name: Smoke-test the image by digest after publication
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          python3 tools/release_smoke.py \
            --bundle dist --image "$IMAGE_REFERENCE" --version "$VERSION" \
            --source-revision "$GITHUB_SHA"

      - name: Attach checksums and release metadata
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s\n' "$IMAGE_REFERENCE" > "dist/image-digest.txt"
          python3 tools/release.py write-release-metadata \
            --output "dist/sil-release-${VERSION}.json" \
            --version "$VERSION" --source-revision "$GITHUB_SHA" \
            --image-reference "$IMAGE_REFERENCE" --image-digest "$IMAGE_DIGEST"
          python3 tools/release.py render-notes \
            --template "docs/releases/v${VERSION}.md" \
            --output release-notes.md --version "$VERSION" \
            --source-revision "$GITHUB_SHA" \
            --image-reference "$IMAGE_REFERENCE" --image-digest "$IMAGE_DIGEST"
          python3 tools/release.py checksums --directory dist
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Create the GitHub release with the normalized title
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$VERSION" --notes-file release-notes.md
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json name --jq .name)" = "$VERSION"
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for file in dist/*; do
            grep -Fxq "$(basename "$file")" <<< "$assets"
          done
