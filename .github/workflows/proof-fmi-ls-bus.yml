name: proof-fmi-ls-bus

# The FMI-LS-BUS CAN acceptance fixture (issue #137), on the supported machine
# class.
#
# It builds third-party FMUs from pinned upstream sources and executes them
# against the published SiL runner image by digest. The evidence gate itself
# therefore tests the release rather than the checkout, and is unaffected by
# the commit that triggers it. Its last three steps are the exception, and the
# reason this also runs on a pull request that touches the Importer: the same
# released runner, with the checkout's `sil` package ahead of it, driving the
# pinned CAN node, connecting two instances of it through the pinned bus
# simulation FMU, and then replacing one of those two with its own Recording —
# the first two judged against expected exchanges written from upstream's
# sources, the third against the live Run it replays.
#
# That is why it is not part of the push gate — but it does run on any pull
# request that touches the fixture or the Importer, because the evidence a
# maintainer reviews has to come from the supported machine class rather than
# from whatever laptop wrote it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'proofs/fmi-ls-bus/**'
      - 'python/src/sil/**'
      - '.github/workflows/proof-fmi-ls-bus.yml'

jobs:
  proof:
    # Native linux/amd64 — the machine class the release supports, and the one
    # the fixture's compiled binaries are built for.
    runs-on: ubuntu-latest
    # Bounded, because an acceptance job that hangs is a job nobody trusts.
    # The whole script — two upstream builds, both reference exchanges and
    # every Run below them — takes a few minutes on this runner; this is the
    # ceiling above which something is wrong rather than slow. Each Process
    # participant response inside the Runs is bounded separately, by
    # `--participant-timeout-ms`.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The decoder the reference exchange reads payloads with, tested against
      # byte strings written from the standard's headers rather than from a
      # Run. It needs no fixture, so it runs before one is built.
      # Pinned like everything else this proof runs: the fixture's whole
      # claim is that what it executed is what someone else can execute.
      - name: Test the operation decoder
        run: |
          python -m pip install --quiet "pytest==9.1.1"
          python -m pytest proofs/fmi-ls-bus/test_can_operations.py -q

      - name: Execute the proof
        run: |
          proofs/fmi-ls-bus/run-proof.sh \
            "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/workspace"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmi-ls-bus-fixture-evidence
          path: ${{ runner.temp }}/evidence

      # The Manifests themselves, so the rejected Runs can be read back rather
      # than only their diagnostics believed.
      - name: Keep the Manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmi-ls-bus-fixture-manifests
          path: ${{ runner.temp }}/workspace/*.json

      # Every Recording the compared Runs produced, so a reviewer can re-run
      # the equivalence check on the artifacts CI executed rather than on a
      # rebuild of them.
      - name: Keep the Recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmi-ls-bus-fixture-recordings
          path: ${{ runner.temp }}/workspace/*.mcap
