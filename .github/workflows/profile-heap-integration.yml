name: profile-heap-integration

# `sil profile --collector heap` with the real Heaptrack (#317) on the
# supported machine class, Linux x86-64/glibc, natively as the unprivileged
# runner user. Heaptrack's launch mode needs no privilege, so the job
# changes no host setting. It needs apt for Heaptrack, so it sits outside
# the general push gate. It runs for PRs that touch the profiler and on
# demand. Its checks compare exact allocation counts and sizes of known
# sites; no check uses a time, an RSS value or an overhead.

on:
  pull_request:
    paths:
      - 'python/src/sil/profile_*.py'
      - 'python/src/sil/diagnostics_run.py'
      - 'kernel/src/main.cpp'
      - 'kernel/src/run_diagnostics.*'
      - 'kernel/src/process_participant.cpp'
      - 'kernel/src/owned_directory.*'
      - 'kernel/src/diagnostics_launcher.c'
      - 'proofs/profiling/workload.py'
      - 'proofs/profiling/workload/**'
      - 'tests/test_profile_heap*.py'
      - 'tests/test_launch_wrapper.py'
      - 'tests/fake_heaptrack/**'
      - '.github/workflows/profile-heap-integration.yml'
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EVIDENCE: ${{ github.workspace }}/build/profile-evidence
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install Heaptrack and the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            heaptrack binutils build-essential cmake
          mkdir -p "$EVIDENCE"
          { uname -a; heaptrack --version; dpkg-query -W heaptrack;
            cc --version | head -1; objcopy --version | head -1; } \
            | tee "$EVIDENCE/host.txt"

      - name: Set up Python environment
        run: |
          uv venv .venv
          uv pip install -p .venv/bin/python -e "python/[dev]"

      - name: Build kernel
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Heap capture with the real and the fake Heaptrack
        env:
          SIL_PROFILE_HEAP: available
          SIL_SKIP_BUILD: '1'
          SIL_PROFILE_EVIDENCE: ${{ env.EVIDENCE }}
        run: .venv/bin/python -m pytest tests/test_profile_heap_integration.py tests/test_profile_heap_run.py tests/test_profile_heap.py tests/test_launch_wrapper.py tests/test_profile_report.py -v -rs

      # Heaptrack's data holds allocation stacks and sizes, no memory
      # contents; the workload holds no secret, and the artifact is kept as
      # the evidence of this run.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-heap-evidence
          path: build/profile-evidence/
