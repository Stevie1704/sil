name: proof-acc-multirate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'proofs/acc-fmi/multirate*'
      - 'proofs/acc-fmi/Dockerfile.multirate'
      - 'proofs/acc-fmi/models/**'
      - 'python/src/sil/fmi/**'
      - 'python/src/sil/compare.py'
      - 'examples/fmu-coupling/**'
      - '.github/workflows/proof-acc-multirate.yml'

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check the authored schedule and comparison contract
        run: |
          python -m pip install -e 'python/[dev]'
          PYTHONPATH=proofs/acc-fmi python -m pytest proofs/acc-fmi/test_multirate.py -q
      - name: Prepare pinned FMPy references and installed runtime
        run: proofs/acc-fmi/multirate-bundle.sh prepare "$PWD/build/acc-multirate-bundle"
      - name: Execute the installed Linux coupling proof
        run: proofs/acc-fmi/multirate-bundle.sh run "$PWD/build/acc-multirate-bundle" "$PWD/build/acc-multirate-evidence"
      - name: Keep the contract, report, Manifests and Recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-multirate-evidence
          path: |
            build/acc-multirate-bundle/bundle.json
            build/acc-multirate-bundle/contract.json
            build/acc-multirate-bundle/references/*.schedule.json
            build/acc-multirate-evidence/report.json
            build/acc-multirate-evidence/*.json
            build/acc-multirate-evidence/*.mcap
            build/acc-multirate-evidence/*.log
