{% extends "base.html" %}

{% block announce %}
  {% set revision = config.extra.revision %}
  Development documentation, built from
  <a href="{{ config.repo_url }}/tree/{{ revision }}"><code>{{ revision[:12] }}</code></a>.
  It can describe unreleased behavior. For the guides of
  your installed version, run <code>sil docs</code>; see the
  <a href="{{ config.repo_url }}/releases">published releases</a>.
{% endblock %}
