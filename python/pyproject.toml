[project]
name = "sil"
version = "0.2.1"
description = "SiL framework: deterministic scheduling + typed data routing for vECU simulation"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["mcap>=1.1"]

[project.urls]
Repository = "https://github.com/Stevie1704/sil"
Source = "https://github.com/Stevie1704/sil"

[project.optional-dependencies]
# The Foxglove qualification tests (tests/test_visualization_foxglove.py) need
# the pinned SDK and a WebSocket client.
dev = ["pytest>=8", "pyelftools>=0.31", "foxglove-sdk==0.30.3", "websockets>=13"]
# sil schema import reads DWARF with pyelftools (public domain / Unlicense).
dwarf = ["pyelftools>=0.31"]
# sil playback serve --adapter foxglove (MIT). The adapter is qualified against
# this exact version (docs/visualization.md "Compatibility matrix").
foxglove = ["foxglove-sdk==0.30.3"]

[project.scripts]
sil = "sil.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sil"]
