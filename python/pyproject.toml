[project]
name = "sil"
version = "0.1.0"
description = "SiL framework: deterministic scheduling + typed data routing for vECU simulation"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["mcap>=1.1"]

[project.urls]
Repository = "https://github.com/Stevie1704/sil"
Source = "https://github.com/Stevie1704/sil"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sil-check = "sil.check:main"
sil-compare = "sil.compare:main"
sil-csv = "sil.csv_recording:main"
sil-fmi-inspect = "sil.fmi.inspection:main"
sil-footprint = "sil.footprint:main"
sil-participant = "sil.participant:main"
sil-acc = "sil.examples.acc.manifest:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sil"]
